services:
  - type: web
    name: linko-mg
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 100 --timeout 0 backend.app:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: linko-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "1"

databases:
  - name: linko-db
    plan: free
    databaseName: linko
